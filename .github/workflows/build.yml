name: Build desktop apps
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
            command: npm run pack:mac
          - os: windows-latest
            target: windows
            command: npm run pack:win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:e2e
      - run: ${{ matrix.command }}
      - run: node scripts/smoke-packaged.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Reader-${{ matrix.target }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
          if-no-files-found: error
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Reader-*
          merge-multiple: true
          path: release-assets
      - name: Verify version and prepare checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag and package version must match'
          assets = Path('release-assets')
          files = sorted(p for p in assets.iterdir() if p.is_file())
          lines = [f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}' for p in files]
          (assets / 'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n')
          PY
      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${RELEASE_TAG}.md"
          if [ ! -f "$notes" ]; then notes=CHANGELOG.md; fi
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Reader $RELEASE_TAG" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
